# Uma entrada por câmera. A linha de contagem é escrita aqui por
# scripts/calibrar_linha.py — não edite as coordenadas à mão.
#
# linha: [x1, y1, x2, y2] em pixels do quadro original
# lado_dentro: sinal do produto vetorial correspondente ao interior
#              do prédio; depende de como a câmera está montada.

cameras:
  entrada_a:
    nome: Entrada Principal
    local: Portaria da frente
    fonte: dados/videos/people-detection.mp4
    linha: [330, 120, 330, 432]
    lado_dentro: -1
    ativa: true
    nota: 'Linha longe do pilar da sala (x ~420-440). Atras de oclusor o track quebra
      no momento da passagem e o cruzamento se perde: aconteceu, e custou uma travessia.'
  entrada_b:
    nome: Entrada Lateral
    local: Acesso pelo estacionamento
    fonte: dados/videos/one-by-one-person-detection.mp4
    linha: [490, 0, 490, 432]
    lado_dentro: -1
    ativa: true
    nota: 'Longe da mesa de apoio: em x=430 o pe da mesa oclui a passagem e custou
      uma travessia (5 em vez de 6).'
  webcam:
    nome: Webcam local
    local: A camera desta maquina
    fonte: 0
    linha: [18, 211, 314, 213]
    lado_dentro: -1
    ativa: true
    nota: 'Unica camera que funciona sem baixar nada. A linha aqui vale para o enquadramento
      de quem calibrou: recalibre na sua com `calibrar_linha.py 0`.'
  mot17_09:
    nome: MOT17-09 (avaliação)
    local: Calçada movimentada, câmera baixa e fixa
    fonte: dados/videos/MOT17-09/img1/%06d.jpg
    linha: [1385, 0, 1385, 1080]
    lado_dentro: -1
    ativa: false
    nota: x=1385 e cruzado por 20 das 26 pessoas anotadas e cai em calcada aberta
      - conferido no quadro 250, sem pilar nem poste sobre a linha. Baixe a sequencia
      com scripts/baixar_mot.py.
  entrada_frontal_4k:
    nome: Entrada de loja, camera frontal
    local: Porta automatica, pessoas entrando de frente para a camera
    fonte: dados/videos/02_entrada_loja_frontal_4k.mp4
    linha: [992, 1187, 2478, 1189]
    lado_dentro: 1
    ativa: false
    nota: 'Unico exemplo de linha HORIZONTAL, e a geometria da porta da faculdade:
      a pessoa anda para dentro, afastando-se da camera, em vez de atravessar o quadro.
      O sugeridor automatico propoe vertical aqui e erra - numa cena frontal a linha
      tem de cruzar a soleira. Video nao versionado.'
  elevada:
    nome: Corredor, camera elevada
    local: Camera obliqua a ~3 m, pessoas atravessando o quadro
    fonte: dados/videos/01_camera_elevada_pessoas_cruzando.mp4
    linha: [420, 0, 420, 576]
    lado_dentro: -1
    ativa: false
    nota: 'x=420 no meio do caminho. Mais a direita (500-650) a linha cai na area
      de estacionamento, onde gente circula em vez de passar: travessias por pessoa
      sobem de 1,40 para 1,63 e o balanco deixa de fechar (11/11 -> 14/18). E a camera
      de referencia de docs/resultados.md. Video nao versionado.'
  zenital:
    nome: Camera zenital (contraexemplo)
    local: Vista de topo, 402x300
    fonte: dados/videos/02_camera_topo_zenital_calcada.mp4
    linha: [0, 155, 402, 155]
    lado_dentro: -1
    ativa: false
    nota: 'Contraexemplo deliberado. Conta, mas inviabiliza a etapa 2: de cima nao
      ha aparencia para reidentificar. Alem disso 402x300 e pequeno demais - a pessoa
      nao chega aos 100 px de altura e o detector a perde. Video nao versionado.'
  entrada_real:
    nome: Entrada da faculdade
    local: PC 24h com o hardware do time de C++
    fonte: http://10.105.231.36:81/stream
    lado_dentro: 1
    ativa: true
    nota: 'Calibrada na cena real em 01/09/2026, com a XIAO ESP32S3 em VGA. A linha
      esta em pixels de 640x480: se alguem mexer no FRAMESIZE do firmware, ela deixa
      de valer e precisa ser recalibrada. O IP vem por DHCP - se a placa reiniciar
      e trocar de endereco, atualize a fonte. Detalhes do firmware em docs/contrato-hardware.md.'
    linha: [120, 380, 373, 421]
  catraca_metro:
    nome: Catraca de metro
    local: Estacao em 4K, passagem canalizada uma pessoa por vez
    ativa: false
    nota: 'Catraca de metro em 4K: passagem canalizada, uma pessoa por vez. Video
      nao versionado (dados/videos/FONTES.md).'
    fonte: dados/videos/05_catraca_metro_4k.mp4
    linha: [2655, 0, 2655, 2160]
    lado_dentro: -1
  escada_rolante:
    nome: Escada rolante
    local: Shopping em 1080p, dois sentidos ao mesmo tempo
    ativa: false
    nota: 'Escada rolante: dois sentidos simultaneos em planos diferentes, gente parada
      durante a travessia. O clipe e preto-e-branco e de foco suave - serve para contagem,
      nao para julgar aparencia na Etapa 2. Nao versionado.'
    fonte: dados/videos/06_escada_rolante_1080p.mp4
    linha: [0, 970, 1920, 970]
    lado_dentro: -1
  shopping_multidao:
    nome: Shopping, camera alta (multidao)
    local: Saguao de shopping em 4K, pessoas atravessando o piso inferior
    ativa: false
    nota: 'Shopping em 4K, 86 s: 157 tracks, oclusao entre pessoas e a regra - caso
      mais duro do acervo para a Etapa 2. A linha vai de y=900 para baixo porque a
      vertical inteira cruzaria tambem a passarela do piso de cima, somando dois fluxos
      num numero so. Video nao versionado.'
    fonte: dados/videos/04_shopping_multidao_4k.mp4
    linha: [835, 900, 835, 2160]
    lado_dentro: -1
  mot17_02:
    nome: MOT17-02 (avaliacao)
    local: Praca em Veneza, camera fixa, fluxo cruzado
    fonte: dados/videos/MOT17-02/img1/%06d.jpg
    linha: [990, 0, 990, 1080]
    lado_dentro: -1
    ativa: false
    nota: x=990 e cruzado por 21 das 62 pessoas anotadas e cai em calcada aberta -
      conferido no quadro 250, longe do tronco da arvore (x~620). Baixe a sequencia
      com scripts/baixar_mot.py.
  mot17_04:
    nome: MOT17-04 (avaliacao)
    local: Rua comercial a noite, camera alta e fixa, multidao densa
    fonte: dados/videos/MOT17-04/img1/%06d.jpg
    linha: [455, 0, 455, 1080]
    lado_dentro: -1
    ativa: false
    nota: 'x=455 e cruzado por 22 das 83 pessoas anotadas - conferido no quadro 250,
      a esquerda do poste de luz (x~675). Cena noturna e densa: e o caso em que a
      deteccao, nao a geometria, limita a contagem.'
