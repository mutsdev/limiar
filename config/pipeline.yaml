# Parâmetros do pipeline de visão e contagem.
# Estão fora do código porque são ajustados por medição, não por raciocínio:
# o valor certo sai de assistir ao vídeo anotado e comparar com a contagem manual.

deteccao:
  modelo: "yolo11n.pt"     # troca para yolo11s.pt / yolo11m.pt se a precisão exigir
  classes: [0]             # 0 = "person" no COCO
  confianca_minima: 0.30   # baixo de propósito: o ByteTrack aproveita detecção fraca
  iou: 0.50
  dispositivo: "auto"      # "auto" | "cpu" | "0" (índice da GPU)
  pular_quadros: 0         # 1 processa 1 de cada 2 quadros; 0 processa todos

rastreio:
  tracker: "bytetrack.yaml"

contagem:
  # Quantos quadros um track precisa existir antes de poder gerar evento.
  # Elimina detecção instantânea e falso positivo de um quadro só.
  idade_minima_track: 3

  # Suavização do ponto de referência: média móvel das últimas N posições.
  janela_suavizacao: 3

  # Faixa morta em pixels em volta da linha. Enquanto a pessoa está dentro
  # dela, nada é contado — evita disparo repetido por tremulação da caixa.
  zona_morta_px: 15

  # Após contar um cruzamento do track T, ignora novos cruzamentos do MESMO T
  # por este intervalo. Trata a pessoa que hesita na porta.
  cooldown_segundos: 1.5

  # Um track sem detecção por este número de quadros é esquecido.
  quadros_ate_esquecer: 60

  # Costura de rastro quebrado: quando o rastreador perde a pessoa atrás de um
  # oclusor e a devolve com id novo, o estado do track antigo é herdado pelo
  # novo se a lacuna for curta e o reaparecimento for perto.
  #
  # DESLIGADA por medição, não por precaução. Ver docs/resultados.md §2: nas
  # duas sequências disponíveis ela não recupera travessia nenhuma (o que se
  # perde é oclusão total, e ninguém rastreia quem não foi detectado) e no
  # vídeo elevado abre o saldo de 0 para 2. O mecanismo existe e está travado
  # por teste; a porta real pode ser o caso em que ele ajuda — a batente de
  # porta é o oclusor que ela trata, e a calçada aberta do MOT17 não tem um.
  #
  # Para decidir na porta real, sem palpite:
  #   python scripts/processar_video.py <camera> --sem-envio --gravar-trilhas
  #   python scripts/reprocessar.py <camera> --varredura
  costura_quadros: 0       # 15 = 0,5 s a 30 fps; 0 desliga
  costura_raio_px: 80      # o quanto ela pode ter andado enquanto sumiu

# Etapa 2 — re-identificação anônima (scripts/identificar_pessoas.py).
# Os limiares são ajustados por medição: scripts/reprocessar_identidade.py
# --varredura sobre uma trilha/2 gravada, contra o gabarito preenchido à mão.
reid:
  modelo: "resnet18"            # "osnet_x0_25" se o resnet18 não separar as pessoas
  recortes_por_track: 5         # quantos recortes recentes entram na média
  intervalo_recorte_quadros: 3  # recorta 1 de cada N quadros de cada pessoa visível
  tamanho_recorte: [128, 256]   # largura, altura — o padrão das redes de re-ID
  limiar_saida: 0.70            # abaixo disto a saída fica "não atribuída"
  limiar_reentrada: 0.75        # acima disto quem entra é alguém que saiu hoje
  janela_lote_s: 60             # PROJETO §12(a): saídas resolvidas em lote, nunca uma por vez
  max_permanencia_h: 12         # "dentro" há mais que isto é saída perdida (fantasma)
  expira_h: 48                  # PROJETO §16.5: o pseudônimo some do banco depois disto
